name: Profile Stats Cards

# Renders the GitHub Analytics cards into assets/ so the README does not
# depend on third-party card services. Uses only the automatic GITHUB_TOKEN.

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
  # Renders the cards immediately when the generator changes, so the README
  # never points at assets that do not exist yet. The bot's own commit only
  # touches assets/, and GITHUB_TOKEN pushes cannot retrigger a workflow.
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render cards, chrome and projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: assets
          README_PATH: README.md
        run: python scripts/generate_profile_stats.py

      # README is included because the generator rewrites the featured
      # projects table between its marker comments.
      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update profile cards and projects table"
          file_pattern: "assets README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
