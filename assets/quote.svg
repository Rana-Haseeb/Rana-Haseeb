<svg xmlns="http://www.w3.org/2000/svg" width="700" height="130" viewBox="0 0 700 130" role="img" aria-label="Developer quote">
  <title>First, solve the problem. Then, write the code. - John Johnson</title>
  <style>
    .c { opacity: 0; animation: f .6s ease-out forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" width="699" height="129" rx="6"
        fill="#0d1117" stroke="#21262d"/>
  <g class="c" style="animation-delay:.1s"><text x="350" y="62" text-anchor="middle" style="font: 400 17px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9">&#8220;First, solve the problem. Then, write the code.&#8221;</text><text x="350" y="92" text-anchor="middle" style="font: 400 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #8b949e">&#8212; John Johnson</text></g>
</svg>
