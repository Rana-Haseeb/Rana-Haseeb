<svg xmlns="http://www.w3.org/2000/svg" width="450" height="215" viewBox="0 0 450 215" role="img" aria-label="Rana Muhammad Haseeb Khan's GitHub Stats">
  <title>Rana Muhammad Haseeb Khan's GitHub Stats</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a55eea"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 600 16px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #a55eea; }
    .k { font: 400 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; }
    .v { font: 700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #22d3ee; }
    .s { font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #8b949e; }
    .n { font: 700 26px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; }
    .c { opacity: 0; animation: f .5s ease-out forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" width="449" height="214" rx="6"
        fill="#0d1117" stroke="#21262d"/>
  <rect x="0.5" y="0.5" width="449" height="214" rx="6" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="159 1167" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="1326;0" dur="7s" repeatCount="indefinite"/></rect>
  <text x="25" y="35" class="t">Rana Muhammad Haseeb Khan's GitHub Stats</text>
  <g class="c" style="animation-delay:0.10s"><circle cx="30" cy="64" r="3" fill="#22d3ee"/><text x="45" y="68" class="k">Total Stars Earned</text><text x="425" y="68" class="v" text-anchor="end">1</text></g>
  <g class="c" style="animation-delay:0.18s"><circle cx="30" cy="88" r="3" fill="#22d3ee"/><text x="45" y="92" class="k">Total Commits</text><text x="425" y="92" class="v" text-anchor="end">315</text></g>
  <g class="c" style="animation-delay:0.26s"><circle cx="30" cy="112" r="3" fill="#22d3ee"/><text x="45" y="116" class="k">Total PRs</text><text x="425" y="116" class="v" text-anchor="end">23</text></g>
  <g class="c" style="animation-delay:0.34s"><circle cx="30" cy="136" r="3" fill="#22d3ee"/><text x="45" y="140" class="k">Total Issues</text><text x="425" y="140" class="v" text-anchor="end">0</text></g>
  <g class="c" style="animation-delay:0.42s"><circle cx="30" cy="160" r="3" fill="#22d3ee"/><text x="45" y="164" class="k">Public Repositories</text><text x="425" y="164" class="v" text-anchor="end">30</text></g>
  <g class="c" style="animation-delay:0.50s"><circle cx="30" cy="184" r="3" fill="#22d3ee"/><text x="45" y="188" class="k">Followers</text><text x="425" y="188" class="v" text-anchor="end">34</text></g>
</svg>
