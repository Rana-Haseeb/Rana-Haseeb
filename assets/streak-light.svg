<svg xmlns="http://www.w3.org/2000/svg" width="450" height="215" viewBox="0 0 450 215" role="img" aria-label="Contribution Streak">
  <title>Contribution Streak</title>
  <style>
    .t { font: 600 16px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #6c5ce7; }
    .k { font: 400 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #1f2328; }
    .v { font: 700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #0e7490; }
    .s { font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #656d76; }
    .n { font: 700 26px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #1f2328; }
    .c { opacity: 0; animation: f .5s ease-out forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" width="449" height="214" rx="6"
        fill="#ffffff" stroke="#d0d7de"/>
  <text x="25" y="35" class="t">Contribution Streak</text>
  <g class="c" style="animation-delay:0.10s"><text x="78" y="103" class="n" text-anchor="middle">353</text><text x="78" y="150" class="k" text-anchor="middle">Total Contributions</text><text x="78" y="168" class="s" text-anchor="middle">Oct 01, 2023 - Present</text></g>
  <g class="c" style="animation-delay:0.22s"><circle cx="225" cy="95" r="40" fill="none" stroke="#0e7490" stroke-width="4"/><text x="225" y="103" class="n" text-anchor="middle">51</text><text x="225" y="150" class="k" text-anchor="middle">Current Streak</text><text x="225" y="168" class="s" text-anchor="middle">Jun 25 - Present</text></g>
  <g class="c" style="animation-delay:0.34s"><text x="372" y="103" class="n" text-anchor="middle">51</text><text x="372" y="150" class="k" text-anchor="middle">Longest Streak</text><text x="372" y="168" class="s" text-anchor="middle"></text></g>
  <line x1="151" y1="55" x2="151" y2="160" stroke="#d0d7de"/>
  <line x1="298" y1="55" x2="298" y2="160" stroke="#d0d7de"/>
</svg>
