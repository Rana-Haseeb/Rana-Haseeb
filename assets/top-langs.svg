<svg xmlns="http://www.w3.org/2000/svg" width="340" height="215" viewBox="0 0 340 215" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a55eea"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 600 16px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #a55eea; }
    .k { font: 400 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; }
    .v { font: 700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #22d3ee; }
    .s { font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #8b949e; }
    .n { font: 700 26px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; }
    .c { opacity: 0; animation: f .5s ease-out forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" width="339" height="214" rx="6"
        fill="#0d1117" stroke="#21262d"/>
  <rect x="0.5" y="0.5" width="339" height="214" rx="6" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="133 973" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="1106;0" dur="7s" repeatCount="indefinite"/></rect>
  <text x="25" y="35" class="t">Most Used Languages</text>
  <g class="c" style="animation-delay:.1s"><clipPath id="r"><rect x="25" y="55" width="290.0" height="9" rx="4.5"/></clipPath><g clip-path="url(#r)"><rect x="25.0" y="55" width="116.5" height="9" fill="#3178c6"/><rect x="141.5" y="55" width="104.3" height="9" fill="#3572A5"/><rect x="245.8" y="55" width="31.4" height="9" fill="#f1e05a"/><rect x="277.2" y="55" width="16.6" height="9" fill="#663399"/><rect x="293.8" y="55" width="11.6" height="9" fill="#e34c26"/><rect x="305.4" y="55" width="9.6" height="9" fill="#4F5D95"/></g></g>
  <g class="c" style="animation-delay:0.15s"><circle cx="30" cy="88" r="5" fill="#3178c6"/><text x="43" y="92" class="k">TypeScript</text><text x="163" y="92" class="s" text-anchor="end">40.2%</text></g>
  <g class="c" style="animation-delay:0.23s"><circle cx="185" cy="88" r="5" fill="#3572A5"/><text x="198" y="92" class="k">Python</text><text x="318" y="92" class="s" text-anchor="end">36.0%</text></g>
  <g class="c" style="animation-delay:0.31s"><circle cx="30" cy="112" r="5" fill="#f1e05a"/><text x="43" y="116" class="k">JavaScript</text><text x="163" y="116" class="s" text-anchor="end">10.8%</text></g>
  <g class="c" style="animation-delay:0.39s"><circle cx="185" cy="112" r="5" fill="#663399"/><text x="198" y="116" class="k">CSS</text><text x="318" y="116" class="s" text-anchor="end">5.7%</text></g>
  <g class="c" style="animation-delay:0.47s"><circle cx="30" cy="136" r="5" fill="#e34c26"/><text x="43" y="140" class="k">HTML</text><text x="163" y="140" class="s" text-anchor="end">4.0%</text></g>
  <g class="c" style="animation-delay:0.55s"><circle cx="185" cy="136" r="5" fill="#4F5D95"/><text x="198" y="140" class="k">PHP</text><text x="318" y="140" class="s" text-anchor="end">3.3%</text></g>
</svg>
